name: 코드 자동 검사

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
      - name: Node.js 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 패키지 설치
        run: npm ci
      - name: 자동 테스트
        run: npm test
      - name: 코드 검사
        run: npm run lint
      - name: 배포용 빌드 검사
        run: npm run build
